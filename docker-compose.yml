services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: lifeos_user
      POSTGRES_PASSWORD: lifeos_password
      POSTGRES_DB: lifeos_db
    ports:
      - "5432:5432"

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"

backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      - db
      - qdrant