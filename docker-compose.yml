services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: lifeos_user
      POSTGRES_PASSWORD: lifeos_password
      POSTGRES_DB: lifeos_db
    ports:
      - "5432:5432"

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db
      - qdrant

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev"
    depends_on:
      - backend
